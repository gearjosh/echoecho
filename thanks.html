<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="img/favicon.ico" rel="shortcut icon" type="img/jpeg">
  <link rel="stylesheet" href="fonts/buffon/stylesheet.css" type="text/css" media="all">
  <link rel="stylesheet" href="fonts/munson/stylesheet.css" type="text/css" media="all">
  <link rel="stylesheet" href="fonts/supermagic/stylesheet.css" type="text/css" media="all">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="colors.css" rel="stylesheet" type="text/css" media="all">
  <link href="styles.css" rel="stylesheet" type="text/css" media="all">
  <title>Contact Echo Echo Recording</title>
</head>

<body class="bg-color-pink text-color-black font-munson-italic hyphens-auto">

  <nav
    class="text-color-yellow bg-color-red h-16 sm:h-20 w-full flex flex-row justify-between items-end pr-4 pl-3 pb-4 sticky top-0 z-10"
    id="header">
    <a href="index.html" class=""><img class="object-contain h-7 sm:h-13" src="img/echoecho_horiz_text.png"
        alt="Echo Echo's logo"></a>
    <div class="flex flex-row uppercase sm:text-lg md:text-2xl font-buf-bold">
      <a class="ml-4 sm:ml-8" href="about.html">About</a>
      <a class="ml-4 sm:ml-8" href="contact.html">Contact</a>
    </div>
  </nav>

  <main id="contact">
    <div class="container p-4 mx-auto h-screen">
      <div class="bg-color-orange p-8 rounded-3xl my-4 min-h-[calc(100%-2rem)]">
        <div class="flex flex-row justify-center items-center sm:space-x-8">
          <div class="hidden sm:flex flex-row h-10 justify-start space-y-2 space-x-2">
            <div class="dot-xs bg-color-black self-center"></div>
            <div class="dot-md bg-color-black"></div>
            <div class="hidden md:block dot-lg bg-color-black"></div>
            <div class="dot-sm bg-color-black self-end"></div>
            <div class="dot-xs bg-color-black self-start"></div>
          </div>

          <h2 class="text-center text-5xl md:text-6xl text-color-red font-magic mb-4">Thank you!</h2>

          <div class="hidden sm:flex flex-row h-10 justify-start space-y-2 space-x-2">
            <div class="dot-xs bg-color-black self-end"></div>
            <div class="dot-xs bg-color-black self-start"></div>
            <div class="hidden md:block dot-md bg-color-black self-end"></div>
            <div class="dot-lg bg-color-black self-start"></div>
            <div class="dot-sm bg-color-black self-center"></div>
          </div>
        </div>

        <div>
          <img class="w-full object-cover mx-auto mb-4" src="img/thanks.png" alt="Echo Echo's recording console">

          <p class="text-3xl text-center text-color-black font-mont uppercase mb-4 mx-auto">
            We appreciate your message,<br/>and we'll get back to you as soon as we can.
          </p>

          <p class="font-magic text-5xl text-center text-color-yellow"><a href="index.html">Back to Echo Echo</a></p>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer" class="bottom-full bg-color-red text-color-yellow h-20 w-full">
    <div class="container flex flex-row justify-between items-center p-4 mx-auto h-full">
      <p class="font-mont uppercase text-3xl"><a href="contact.html">Book a tour!</a></p>
      <div class="flex flex-row justify-center items-center space-x-2">
        <a href="https://www.instagram.com/echoechorecording" target="_blank"><img class="rounded-full bg-color-olive"
            src="img/instagram_white_28dp.png" alt="Instagram"></a>
        <a href="https://www.facebook.com/echoechopdx" target="_blank"><img class="rounded-full bg-color-olive"
            src="img/facebook_white_28dp.png" alt="Facebook"></a>
        <a href="https://www.youtube.com/echoechorecording" target="_blank"><img class="rounded-full bg-color-olive"
            src="img/youtube_white_28dp.png" alt="YouTube"></a>
      </div>
    </div>
  </footer>

  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
  <script type="text/javascript" src="script.js"></script>
</body>

</html>
