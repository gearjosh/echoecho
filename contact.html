<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="img/favicon.ico" rel="shortcut icon" type="img/jpeg">
  <link rel="stylesheet" href="fonts/buffon/stylesheet.css" type="text/css" media="all">
  <link rel="stylesheet" href="fonts/munson/stylesheet.css" type="text/css" media="all">
  <link rel="stylesheet" href="fonts/supermagic/stylesheet.css" type="text/css" media="all">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="colors.css" rel="stylesheet" type="text/css" media="all">
  <link href="styles.css" rel="stylesheet" type="text/css" media="all">
  <title>Contact Echo Echo Recording</title>
</head>

<body class="bg-color-pink text-color-black font-munson-italic hyphens-auto">

  <section
    class="text-color-yellow bg-color-red h-16 sm:h-20 w-full flex flex-row justify-between items-end pr-4 pl-3 pb-4 sticky top-0 z-10"
    id="header">
    <a href="index.html" class=""><img class="object-contain h-7 sm:h-13" src="img/echoecho_horiz_text.png"
        alt="Echo Echo's logo"></a>
    <div class="flex flex-row uppercase sm:text-lg md:text-2xl font-buf-bold">
      <a class="ml-4 sm:ml-8" href="about.html">About</a>
      <a class="ml-4 sm:ml-8" href="contact.html">Contact</a>
    </div>
  </section>

  <section id="contact" class="">
    <div class="container p-4 mx-auto">
      <div class="bg-color-green p-8 rounded-3xl my-4">
        <div class="flex flex-row justify-center items-center sm:space-x-8">
          <div class="hidden sm:flex flex-row h-10 justify-start space-y-2 space-x-2">
            <div class="dot-xs bg-color-black self-center"></div>
            <div class="dot-md bg-color-black"></div>
            <div class="hidden md:block dot-lg bg-color-black"></div>
            <div class="dot-sm bg-color-black self-end"></div>
            <div class="dot-xs bg-color-black self-start"></div>
          </div>

          <h2 class="text-center text-5xl md:text-6xl text-color-orange font-magic mb-4">Contact Echo Echo</h2>

          <div class="hidden sm:flex flex-row h-10 justify-start space-y-2 space-x-2">
            <div class="dot-xs bg-color-black self-end"></div>
            <div class="dot-xs bg-color-black self-start"></div>
            <div class="hidden md:block dot-md bg-color-black self-end"></div>
            <div class="dot-lg bg-color-black self-start"></div>
            <div class="dot-sm bg-color-black self-center"></div>
          </div>
        </div>

        <img class="aspect-19/9 object-cover rounded-3xl mb-4 mx-auto" src="img/contact_us.jpeg"
        alt="the inside of Echo Echo">
        <h3 class="text-2xl font-mont mb-4 text-center uppercase">We'd love to hear from you!</h3>

        <form class="flex flex-col justify-center items-center w-full sm:w-4/5 mx-auto mb-8" action="https://formsubmit.io/send/other.josh.gearheart@gmail.com">
          <!-- <input name="_redirect" type="hidden" id="name" value="https://gearjosh.github.io/echoecho/thanks.html"> -->

          <label class="text-xl mb-1" for="name">Name:</label>
          <input class="rounded-full bg-color-white py-2 px-4 w-full sm:w-3/4 mb-4" type="text" id="name" name="name" required>

          <label class="text-xl mb-1" for="email">Email:</label>
          <input class="rounded-full bg-color-white py-2 px-4 w-full sm:w-3/4 mb-4" type="email" id="email" name="email"
            required>

          <label class="text-xl mb-1" for="message">Message:</label>
          <textarea class="rounded-4xl bg-color-white p-4 w-full mb-4" id="message" name="message" rows="8"
            required></textarea>

          <input name="_formsubmit_id" type="text" style="display:none">

          <button
            class="cursor-pointer rounded-full py-4 text-4xl uppercase font-buf-bold text-color-white bg-color-black transition-all duration-400 ease-out w-3/5"
            type="submit">Send</button>
        </form>

        <div class="flex flex-col lg:flex-row justify-around items-center lg:items-start">
          <div class="flex flex-col mb-4 lg:mb-0">
            <iframe class="rounded-3xl bg-color-white hidden md:block"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2794.6100000496294!2d-122.67450782372195!3d45.53805317107529!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5495a7503b4ab311%3A0x95812b8507f14877!2s2119%20N%20Kerby%20Ave%2C%20Portland%2C%20OR%2097227!5e0!3m2!1sen!2sus!4v1756845613047!5m2!1sen!2sus"
              width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        
            <iframe class="rounded-3xl bg-color-white hidden sm:block md:hidden mx-auto"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2794.6100000496294!2d-122.67450782372195!3d45.53805317107529!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5495a7503b4ab311%3A0x95812b8507f14877!2s2119%20N%20Kerby%20Ave%2C%20Portland%2C%20OR%2097227!5e0!3m2!1sen!2sus!4v1756845613047!5m2!1sen!2sus"
              width="500" height="375" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        
            <iframe class="rounded-3xl bg-color-white sm:hidden mx-auto"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2794.6100000496294!2d-122.67450782372195!3d45.53805317107529!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5495a7503b4ab311%3A0x95812b8507f14877!2s2119%20N%20Kerby%20Ave%2C%20Portland%2C%20OR%2097227!5e0!3m2!1sen!2sus!4v1756845613047!5m2!1sen!2sus"
              width="300" height="225" style="border:0;" allowfullscreen="" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade">
            </iframe>
            <p class="text-center md:text-xl mt-4">2119 N Kerby Ave, Portland, OR 97227</p>
          </div>
        </div>
      </div>


    </div>
  </section>

  <section id="footer" class="bottom-full bg-color-red text-color-yellow h-20 w-full">
    <div class="container flex flex-row justify-between items-center p-4 mx-auto h-full">
      <p class="font-mont uppercase text-3xl"><a href="contact.html">Book a tour!</a></p>
      <div class="flex flex-row justify-center items-center space-x-2">
        <a href="https://www.instagram.com/echoechorecording" target="_blank"><img class="rounded-full bg-color-olive"
            src="img/instagram_white_28dp.png" alt="Instagram"></a>
        <a href="https://www.facebook.com/echoechopdx" target="_blank"><img class="rounded-full bg-color-olive"
            src="img/facebook_white_28dp.png" alt="Facebook"></a>
        <a href="https://www.youtube.com/echoechorecording" target="_blank"><img class="rounded-full bg-color-olive"
            src="img/youtube_white_28dp.png" alt="YouTube"></a>
      </div>
    </div>
  </section>

  <script type="text/javascript" src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
  <script type="text/javascript" src="script.js"></script>
</body>

</html>
